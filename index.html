    function App() {
      const [currentView, setCurrentView] = useState('calendar');
      const [selectedDate, setSelectedDate] = useState('2026-08-26');
      const [workoutLogs, setWorkoutLogs] = useState(INITIAL_LOGS);

      const [stagedExercises, setStagedExercises] = useState([]);
      const [activeSession, setActiveSession] = useState(null);
      const [currentExIndex, setCurrentExIndex] = useState(0);

      // 운동 DB (즐겨찾기 토글 가능하도록 상태로 관리)
      const [exerciseDb, setExerciseDb] = useState(() => EXERCISE_DATABASE_SEED.map(e => ({ ...e })));

      const handleToggleFavorite = (exerciseId) => {
        setExerciseDb(prev => prev.map(e => e.id === exerciseId ? { ...e, isFavorite: !e.isFavorite } : e));
      };

      // 루틴(템플릿) 상태
      const [routines, setRoutines] = useState([]);

      const handleSaveRoutine = (name, exercises) => {
        if (!name || exercises.length === 0) return;
        const partNames = [...new Set(exercises.map(ex => {
          const bp = BODY_PARTS.find(p => p.id === ex.partId);
          return bp ? bp.name : '';
        }).filter(Boolean))];
        const newRoutine = {
          id: `r_${Date.now()}`,
          name,
          partSummary: partNames.join(', '),
          exercises: exercises.map(ex => ({ id: ex.id, partId: ex.partId, name: ex.name, category: ex.category, equipment: ex.equipment })),
          createdAt: new Date().toISOString().slice(0, 10)
        };
        setRoutines(prev => [newRoutine, ...prev]);
      };

      const handleDeleteRoutine = (routineId) => {
        setRoutines(prev => prev.filter(r => r.id !== routineId));
      };

      // 교체 모달 상태
      const [isReplaceModalOpen, setIsReplaceModalOpen] = useState(false);

      // 운동 중 운동추가 모달 상태
      const [isAddExerciseModalOpen, setIsAddExerciseModalOpen] = useState(false);

      // 캘린더 루틴 적용 모달 상태
      const [isRoutineModalOpen, setIsRoutineModalOpen] = useState(false);

      // 운동 정보/히스토리/차트 모달 상태
      const [exerciseInfoTarget, setExerciseInfoTarget] = useState(null);

      // 날짜 롱탭 복사/이동/삭제 모달 상태
      const [dateActionState, setDateActionState] = useState(null); // { date, mode: 'menu' | 'pick-target', action: 'copy' | 'move' }

      // 안드로이드 뒤로가기 버튼 → 이전 단계 이동 (앱 종료 방지)
      useEffect(() => {
        window.history.replaceState({ app: true }, '');
        const handlePopState = () => {
          if (isReplaceModalOpen) { setIsReplaceModalOpen(false); window.history.pushState({ app: true }, ''); return; }
          if (isAddExerciseModalOpen) { setIsAddExerciseModalOpen(false); window.history.pushState({ app: true }, ''); return; }
          if (isRoutineModalOpen) { setIsRoutineModalOpen(false); window.history.pushState({ app: true }, ''); return; }
          if (exerciseInfoTarget) { setExerciseInfoTarget(null); window.history.pushState({ app: true }, ''); return; }
          if (dateActionState) { setDateActionState(null); window.history.pushState({ app: true }, ''); return; }
          if (currentView === 'workout') { setCurrentView('calendar'); window.history.pushState({ app: true }, ''); return; }
          if (currentView === 'select') { setCurrentView('calendar'); window.history.pushState({ app: true }, ''); return; }
          // 캘린더 루트 + 모달 없음 → 실제 앱 종료 허용 (별도 처리 없음)
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, [currentView, isReplaceModalOpen, isAddExerciseModalOpen, isRoutineModalOpen, exerciseInfoTarget, dateActionState]);

      // 화면 전환 시 히스토리 스택에 push (뒤로가기 대응)
      const navigatePush = () => {
        try { window.history.pushState({ app: true }, ''); } catch (e) {}
      };

      // 휴식 타이머 상태
      const [timerActive, setTimerActive] = useState(false);
      const [timerTotal, setTimerTotal] = useState(60);
      const [timerRemaining, setTimerRemaining] = useState(60);
      const [isMuted, setIsMuted] = useState(false);
      const timerEndTimeRef = useRef(null);
      const timerIntervalRef = useRef(null);
      const vibratedTicksRef = useRef(new Set());

      const startTimer = (seconds) => {
        setTimerTotal(seconds);
        setTimerRemaining(seconds);
        setTimerActive(true);
        vibratedTicksRef.current = new Set();
        
        const now = Date.now();
        timerEndTimeRef.current = now + seconds * 1000;

        if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);

        timerIntervalRef.current = setInterval(() => {
          const remainingMs = timerEndTimeRef.current - Date.now();
          const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));

          setTimerRemaining(remainingSec);

          // 종료 10초 전(길게) + 3,2,1초 전(강하게) 진동 (한 번씩만)
          if ([10, 3, 2, 1].includes(remainingSec) && !vibratedTicksRef.current.has(remainingSec)) {
            vibratedTicksRef.current.add(remainingSec);
            vibrateTick(remainingSec === 10 ? 450 : 300);
          }

          if (remainingSec <= 0) {
            clearInterval(timerIntervalRef.current);
            setTimerActive(false);
            if (navigator.vibrate) navigator.vibrate([250, 100, 250]);
            if (!isMuted) playBoxingBellSound();
          }
        }, 200);
      };

      const stopTimer = () => {
        if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
        setTimerActive(false);
      };

      const addTimerSeconds = (sec) => {
        if (!timerActive) return;
        timerEndTimeRef.current += sec * 1000;
        const remainingMs = timerEndTimeRef.current - Date.now();
        const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));
        setTimerRemaining(remainingSec);
        setTimerTotal(prev => Math.max(1, prev + sec));
      };

      const handleToggleSetComplete = (exIdx, setIdx) => {
        if (!activeSession) return;
        const updatedExercises = [...activeSession.exercises];
        const targetSet = updatedExercises[exIdx].sets[setIdx];
        const willBeCompleted = !targetSet.completed;

        targetSet.completed = willBeCompleted;
        setActiveSession({ ...activeSession, exercises: updatedExercises });

        if (willBeCompleted) {
          startTimer(targetSet.restSeconds || 60);
        }
      };

      const handleUpdateSetField = (exIdx, setIdx, field, delta) => {
        if (!activeSession) return;
        const updatedExercises = [...activeSession.exercises];
        const targetSet = updatedExercises[exIdx].sets[setIdx];

        if (field === 'weight') targetSet.weight = Math.max(0, targetSet.weight + delta);
        if (field === 'reps') targetSet.reps = Math.max(1, targetSet.reps + delta);
        if (field === 'restSeconds') targetSet.restSeconds = Math.max(10, targetSet.restSeconds + delta);

        setActiveSession({ ...activeSession, exercises: updatedExercises });
      };

      // 무게/횟수 직접 입력 (절대값 지정)
      const handleSetFieldDirect = (exIdx, setIdx, field, value) => {
        if (!activeSession) return;
        const updatedExercises = [...activeSession.exercises];
        const targetSet = updatedExercises[exIdx].sets[setIdx];
        const num = Number(value);
        if (Number.isNaN(num)) return;

        if (field === 'weight') targetSet.weight = Math.max(0, num);
        if (field === 'reps') targetSet.reps = Math.max(0, Math.round(num));

        setActiveSession({ ...activeSession, exercises: updatedExercises });
      };

      // 세트 원버튼 삭제
      const handleDeleteSet = (exIdx, setIdx) => {
        if (!activeSession) return;
        const updatedExercises = [...activeSession.exercises];
        const currentSets = updatedExercises[exIdx].sets;

        if (currentSets.length <= 1) {
          alert("최소 1개 이상의 세트가 유지되어야 합니다.");
          return;
        }

        currentSets.splice(setIdx, 1);
        currentSets.forEach((s, idx) => { s.setNum = idx + 1; });

        setActiveSession({ ...activeSession, exercises: updatedExercises });
      };

      const handleAddSet = (exIdx) => {
        if (!activeSession) return;
        const updatedExercises = [...activeSession.exercises];
        const sets = updatedExercises[exIdx].sets;
        const lastSet = sets[sets.length - 1] || { weight: 40, reps: 10, restSeconds: 60 };

        sets.push({
          setNum: sets.length + 1,
          weight: lastSet.weight,
          reps: lastSet.reps,
          restSeconds: lastSet.restSeconds,
          completed: false
        });

        setActiveSession({ ...activeSession, exercises: updatedExercises });
      };

      // 운동 목록 → 세션용 포맷 변환 (공통 헬퍼)
      const formatExercisesForSession = (list) => list.map(ex => ({
        id: ex.id,
        partId: ex.partId,
        name: ex.name,
        prWeight: 90,
        prReps: 8,
        pr1RM: 112.2,
        sets: [
          { setNum: 1, weight: 70, reps: 15, restSeconds: 60, completed: false },
          { setNum: 2, weight: 75, reps: 15, restSeconds: 60, completed: false },
          { setNum: 3, weight: 80, reps: 12, restSeconds: 60, completed: false },
          { setNum: 4, weight: 85, reps: 9, restSeconds: 60, completed: false },
        ]
      }));

      // 대기열 운동으로 세션 시작
      const handleStartWorkoutWithStaged = () => {
        const formattedExercises = formatExercisesForSession(stagedExercises);

        const newSession = {
          date: selectedDate,
          exercises: formattedExercises
        };

        setWorkoutLogs(prev => ({
          ...prev,
          [selectedDate]: {
            durationMinutes: 60,
            totalSets: formattedExercises.reduce((sum, e) => sum + e.sets.length, 0),
            breakdown: { '운동완수': formattedExercises.length },
            exercises: formattedExercises
          }
        }));

        setActiveSession(newSession);
        setCurrentExIndex(0);
        setCurrentView('workout');
        navigatePush();
      };

      // 루틴을 선택 날짜에 바로 적용
      const handleApplyRoutineToDate = (routine, targetDate) => {
        const formattedExercises = formatExercisesForSession(routine.exercises);
        const newSession = { date: targetDate, exercises: formattedExercises };

        setWorkoutLogs(prev => ({
          ...prev,
          [targetDate]: {
            durationMinutes: 60,
            totalSets: formattedExercises.reduce((sum, e) => sum + e.sets.length, 0),
            breakdown: { '운동완수': formattedExercises.length },
            exercises: formattedExercises
          }
        }));

        setActiveSession(newSession);
        setCurrentExIndex(0);
        setCurrentView('workout');
        setIsRoutineModalOpen(false);
        navigatePush();
      };

      // 운동 진행 중 새 운동 추가
      const handleAddExercisesToSession = (newExercises) => {
        if (!activeSession || newExercises.length === 0) { setIsAddExerciseModalOpen(false); return; }
        const additions = formatExercisesForSession(newExercises);
        const updatedExercises = [...activeSession.exercises, ...additions];
        const updatedSession = { ...activeSession, exercises: updatedExercises };
        setActiveSession(updatedSession);
        setWorkoutLogs(prev => ({
          ...prev,
          [activeSession.date]: {
            ...(prev[activeSession.date] || {}),
            totalSets: updatedExercises.reduce((sum, e) => sum + e.sets.length, 0),
            exercises: updatedExercises
          }
        }));
        setIsAddExerciseModalOpen(false);
      };

      // 날짜 롱탭 → 복사 / 이동 / 삭제
      const handleDeleteDateLog = (date) => {
        setWorkoutLogs(prev => {
          const next = { ...prev };
          delete next[date];
          return next;
        });
        setDateActionState(null);
      };

      const handleCopyDateLog = (fromDate, toDate) => {
        setWorkoutLogs(prev => {
          if (!prev[fromDate]) return prev;
          return { ...prev, [toDate]: JSON.parse(JSON.stringify(prev[fromDate])) };
        });
        setDateActionState(null);
      };

      const handleMoveDateLog = (fromDate, toDate) => {
        setWorkoutLogs(prev => {
          if (!prev[fromDate]) return prev;
          const next = { ...prev, [toDate]: JSON.parse(JSON.stringify(prev[fromDate])) };
          delete next[fromDate];
          return next;
        });
        setDateActionState(null);
      };

      // 교체 수행 핸들러
      const handleReplaceExercise = (newEx) => {
        if (!activeSession) return;
        const updatedExercises = [...activeSession.exercises];
        
        updatedExercises[currentExIndex] = {
          id: newEx.id,
          partId: newEx.partId,
          name: newEx.name,
          prWeight: 80,
          prReps: 10,
          pr1RM: 100,
          sets: [
            { setNum: 1, weight: 50, reps: 12, restSeconds: 60, completed: false },
            { setNum: 2, weight: 55, reps: 12, restSeconds: 60, completed: false },
            { setNum: 3, weight: 60, reps: 10, restSeconds: 60, completed: false },
          ]
        };

        setActiveSession({ ...activeSession, exercises: updatedExercises });
        setIsReplaceModalOpen(false);
      };

      return (
        <div className="flex flex-col h-full w-full bg-[#121212] text-gray-100 font-sans overflow-hidden">
          {currentView === 'calendar' && (
            <CalendarView 
              selectedDate={selectedDate}
              setSelectedDate={setSelectedDate}
              workoutLogs={workoutLogs}
              routines={routines}
              isRoutineModalOpen={isRoutineModalOpen}
              onOpenRoutineModal={() => { setIsRoutineModalOpen(true); navigatePush(); }}
              onCloseRoutineModal={() => setIsRoutineModalOpen(false)}
              onApplyRoutine={(routine) => handleApplyRoutineToDate(routine, selectedDate)}
              dateActionState={dateActionState}
              setDateActionState={(state) => { setDateActionState(state); if (state) navigatePush(); }}
              onDeleteDateLog={handleDeleteDateLog}
              onCopyDateLog={handleCopyDateLog}
              onMoveDateLog={handleMoveDateLog}
              onOpenExerciseSelect={() => {
                setStagedExercises([]);
                setCurrentView('select');
                navigatePush();
              }}
              onOpenWorkoutDetail={(date) => {
                const dayData = workoutLogs[date];
                if (dayData && dayData.exercises && dayData.exercises.length > 0) {
                  setActiveSession({ date, exercises: dayData.exercises });
                  setCurrentExIndex(0);
                  setCurrentView('workout');
                } else {
                  setStagedExercises([]);
                  setCurrentView('select');
                }
                navigatePush();
              }}
            />
          )}

          {currentView === 'select' && (
            <MultiDepthSelectView 
              exerciseDb={exerciseDb}
              onToggleFavorite={handleToggleFavorite}
              routines={routines}
              onSaveRoutine={handleSaveRoutine}
              onDeleteRoutine={handleDeleteRoutine}
              stagedExercises={stagedExercises}
              setStagedExercises={setStagedExercises}
              onBack={() => setCurrentView('calendar')}
              onComplete={handleStartWorkoutWithStaged}
            />
          )}

          {currentView === 'workout' && activeSession && (
            <WorkoutDetailView 
              activeSession={activeSession}
              currentExIndex={currentExIndex}
              setCurrentExIndex={setCurrentExIndex}
              onBack={() => setCurrentView('calendar')}
              handleToggleSetComplete={handleToggleSetComplete}
              handleUpdateSetField={handleUpdateSetField}
              handleSetFieldDirect={handleSetFieldDirect}
              handleDeleteSet={handleDeleteSet}
              handleAddSet={handleAddSet}
              onOpenReplace={() => { setIsReplaceModalOpen(true); navigatePush(); }}
              onOpenAddExercise={() => { setIsAddExerciseModalOpen(true); navigatePush(); }}
              onOpenExerciseInfo={(ex) => { setExerciseInfoTarget(ex); navigatePush(); }}
              onSaveRoutine={handleSaveRoutine}
              timerActive={timerActive}
              timerTotal={timerTotal}
              timerRemaining={timerRemaining}
              isMuted={isMuted}
              setIsMuted={setIsMuted}
              startTimer={startTimer}
              stopTimer={stopTimer}
              addTimerSeconds={addTimerSeconds}
            />
          )}

          {/* 운동 교체 모달 팝업 */}
          {isReplaceModalOpen && activeSession && (
            <ReplaceExerciseModal 
              exerciseDb={exerciseDb}
              currentExercise={activeSession.exercises[currentExIndex]}
              onClose={() => setIsReplaceModalOpen(false)}
              onSelectReplace={handleReplaceExercise}
            />
          )}

          {/* 운동 중 운동 추가 모달 */}
          {isAddExerciseModalOpen && activeSession && (
            <AddExerciseModal
              exerciseDb={exerciseDb}
              onToggleFavorite={handleToggleFavorite}
              routines={routines}
              onSaveRoutine={handleSaveRoutine}
              onDeleteRoutine={handleDeleteRoutine}
              existingIds={activeSession.exercises.map(e => e.id)}
              onClose={() => setIsAddExerciseModalOpen(false)}
              onComplete={handleAddExercisesToSession}
            />
          )}

          {/* 운동 정보 / 히스토리 / 차트 모달 */}
          {exerciseInfoTarget && (
            <ExerciseInfoModal
              exercise={exerciseInfoTarget}
              workoutLogs={workoutLogs}
              onClose={() => setExerciseInfoTarget(null)}
            />
          )}
        </div>
      );
    }

    // ============================================================================
    // 화면 1: 캘린더 메인 화면
    // ============================================================================
    function CalendarView({
      selectedDate, setSelectedDate, workoutLogs, onOpenExerciseSelect, onOpenWorkoutDetail,
      routines, isRoutineModalOpen, onOpenRoutineModal, onCloseRoutineModal, onApplyRoutine,
      dateActionState, setDateActionState, onDeleteDateLog, onCopyDateLog, onMoveDateLog
    }) {
      const [currentYearMonth, setCurrentYearMonth] = useState({ year: 2026, month: 8 });
      const [isMonthPickerOpen, setIsMonthPickerOpen] = useState(false);
      const touchStartXRef = useRef(null);
      const longPressTimerRef = useRef(null);
      const longPressFiredRef = useRef(false);
      const [targetPickDate, setTargetPickDate] = useState({ year: 2026, month: 8, day: 1 });

      // 날짜 롱탭 시작 (복사/이동/삭제 메뉴)
      const handleDayPressStart = (dateStr, hasLog) => {
        longPressFiredRef.current = false;
        if (!hasLog) return;
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);
        longPressTimerRef.current = setTimeout(() => {
          longPressFiredRef.current = true;
          if (navigator.vibrate) navigator.vibrate(40);
          setDateActionState({ date: dateStr, mode: 'menu', action: null });
        }, 500);
      };
      const handleDayPressEnd = () => {
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);
      };
      const handleDayClick = (dateStr) => {
        if (longPressFiredRef.current) { longPressFiredRef.current = false; return; }
        setSelectedDate(dateStr);
      };

      const formattedMonthStr = `${currentYearMonth.year}.${String(currentYearMonth.month).padStart(2, '0')}`;

      const handleTouchStart = (e) => {
        touchStartXRef.current = e.touches[0].clientX;
      };

      const handleTouchEnd = (e) => {
        if (touchStartXRef.current === null) return;
        const diffX = touchStartXRef.current - e.changedTouches[0].clientX;

        if (Math.abs(diffX) > 50) {
          if (diffX > 0) changeMonth(1);
          else changeMonth(-1);
        }
        touchStartXRef.current = null;
      };

      const changeMonth = (delta) => {
        setCurrentYearMonth(prev => {
          let newM = prev.month + delta;
          let newY = prev.year;
          if (newM > 12) { newM = 1; newY += 1; }
          if (newM < 1) { newM = 12; newY -= 1; }
          return { year: newY, month: newM };
        });
      };

      const weeksData = [
        { weekNum: '30주', time: '5.2h', sets: '150s' },
        { weekNum: '31주', time: '5.2h', sets: '145s' },
        { weekNum: '32주', time: '4.1h', sets: '110s' },
        { weekNum: '33주', time: '5.8h', sets: '151s' },
        { weekNum: '34주', time: '3.8h', sets: '141s' },
        { weekNum: '35주', time: '0.9h', sets: '9s' },
      ];

      const calendarDays = useMemo(() => {
        const { year, month } = currentYearMonth;
        const firstDay = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

        const days = [];

        const prevMonthVal = month === 1 ? 12 : month - 1;
        const prevYearVal = month === 1 ? year - 1 : year;
        for (let i = firstDay - 1; i >= 0; i--) {
          const dayNum = daysInPrevMonth - i;
          const dateStr = `${prevYearVal}-${String(prevMonthVal).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
          days.push({ day: dayNum, date: dateStr, isPrev: true });
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          days.push({ day: d, date: dateStr, isCurrentMonth: true });
        }

        const nextMonthVal = month === 12 ? 1 : month + 1;
        const nextYearVal = month === 12 ? year + 1 : year;
        const remaining = 42 - days.length;
        for (let n = 1; n <= remaining; n++) {
          const dateStr = `${nextYearVal}-${String(nextMonthVal).padStart(2, '0')}-${String(n).padStart(2, '0')}`;
          days.push({ day: n, date: dateStr, isNext: true });
        }

        return days;
      }, [currentYearMonth]);

      const selectedDayLog = workoutLogs[selectedDate];

      return (
        <div className="flex flex-col h-full bg-[#121212] overflow-hidden">
          <div className="flex items-center justify-between px-4 py-3 bg-[#1E1E1E] border-b border-gray-800 flex-shrink-0">
            <button className="p-1 text-gray-400 hover:text-white"><Icon name="layers" /></button>
            
            <div className="flex items-center space-x-2">
              <button onClick={() => changeMonth(-1)} className="p-1 text-gray-400 hover:text-white">
                <Icon name="chevron-left" className="w-4 h-4" />
              </button>
              <button 
                onClick={() => setIsMonthPickerOpen(true)}
                className="flex items-center space-x-1.5 bg-[#282828] hover:bg-[#333333] px-3 py-1.5 rounded-lg border border-gray-700 transition-colors"
              >
                <Icon name="calendar" className="w-4 h-4 text-blue-400" />
                <span className="text-base font-bold tracking-tight text-white">{formattedMonthStr}</span>
                <Icon name="chevron-down" className="w-4 h-4 text-gray-400" />
              </button>
              <button onClick={() => changeMonth(1)} className="p-1 text-gray-400 hover:text-white">
                <Icon name="chevron-right" className="w-4 h-4" />
              </button>
            </div>

            <div className="flex items-center space-x-3 text-gray-300">
              <button onClick={() => setIsMonthPickerOpen(true)} className="p-1 hover:text-white"><Icon name="calendar" /></button>
              <button className="p-1 hover:text-white"><Icon name="award" /></button>
              <button className="p-1 hover:text-white"><Icon name="more-vertical" /></button>
            </div>
          </div>

          <div 
            onTouchStart={handleTouchStart}
            onTouchEnd={handleTouchEnd}
            className="flex-1 flex overflow-hidden"
          >
            <div className="w-14 bg-[#181818] border-r border-gray-800/60 flex flex-col pt-1 text-xs text-gray-400 flex-shrink-0">
              {weeksData.map((week, idx) => (
                <div key={idx} className="flex-1 flex flex-col justify-center items-center px-0.5 border-b border-gray-800/40">
                  <span className="font-semibold text-gray-300 text-[11px]">{week.weekNum}</span>
                  <span className="text-[9px] text-gray-500">{week.time}</span>
                  <span className="text-[9px] text-blue-400">{week.sets}</span>
                </div>
              ))}
            </div>

            <div className="flex-1 grid grid-cols-7 grid-rows-6 gap-[1px] bg-gray-800/40 overflow-y-auto">
              {calendarDays.map((item, idx) => {
                const dateStr = item.date;
                const log = dateStr ? workoutLogs[dateStr] : null;
                const isSelected = selectedDate === dateStr;

                return (
                  <div
                    key={idx}
                    onClick={() => dateStr && handleDayClick(dateStr)}
                    onTouchStart={() => dateStr && handleDayPressStart(dateStr, !!log)}
                    onTouchEnd={handleDayPressEnd}
                    onTouchMove={handleDayPressEnd}
                    onMouseDown={() => dateStr && handleDayPressStart(dateStr, !!log)}
                    onMouseUp={handleDayPressEnd}
                    onMouseLeave={handleDayPressEnd}
                    className={`p-1 flex flex-col justify-between cursor-pointer transition-colors relative min-h-[55px] ${
                      !item.isCurrentMonth ? 'bg-[#151518] text-gray-500' : 'bg-[#1A1A1A] text-gray-300'
                    } ${isSelected ? 'ring-2 ring-blue-500 bg-[#222834]' : 'hover:bg-[#222222]'}`}
                  >
                    <div className="flex justify-between items-center">
                      <span className={`text-xs font-semibold ${item.isCurrentMonth ? 'text-gray-200' : 'text-gray-500'}`}>
                        {item.day}
                      </span>
                      {log && <span className="w-1.5 h-1.5 bg-blue-500 rounded-full"></span>}
                    </div>

                    {log && (
                      <div className="mt-0.5 bg-[#252A36] border border-blue-900/40 rounded p-1 text-[9px] space-y-0.5 leading-tight overflow-hidden">
                        <div className="text-blue-300 font-medium">{log.durationMinutes}분</div>
                        <div className="text-gray-400">{log.totalSets}세트</div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-[#1E1E1E] border-t border-gray-800 p-3 bottom-bar-safe flex items-center justify-between flex-shrink-0 z-10">
            <div>
              <div className="text-sm font-bold text-gray-100">{selectedDate}</div>
              <div className="text-xs text-gray-400">{selectedDayLog ? `${selectedDayLog.totalSets}세트 진행 완료` : '등록된 운동 없음'}</div>
            </div>

            <div className="flex space-x-2">
              <button 
                onClick={() => {
                  setSelectedDate('2026-08-28');
                  setCurrentYearMonth({ year: 2026, month: 8 });
                }} 
                className="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-200 rounded-lg active:scale-95 transition-transform"
              >
                오늘
              </button>
              <button 
                onClick={onOpenRoutineModal}
                className="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-200 rounded-lg active:scale-95 transition-transform"
              >
                루틴
              </button>
              <button 
                onClick={() => onOpenWorkoutDetail(selectedDate)}
                className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white rounded-lg flex items-center space-x-1 shadow-md active:scale-95 transition-transform"
              >
                <span>{selectedDayLog ? '기록 보기' : '운동 추가'}</span>
                <Icon name="arrow-right" className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>

          {/* 루틴 적용 모달 (캘린더에서 바로 루틴 불러오기) */}
          {isRoutineModalOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-[#1E1E1E] border border-gray-700 rounded-2xl w-full max-w-sm max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-4 border-b border-gray-800 flex justify-between items-center bg-[#252525]">
                  <div>
                    <h3 className="font-bold text-base text-gray-100">템플릿 선택</h3>
                    <p className="text-xs text-blue-400">{selectedDate}에 루틴 적용</p>
                  </div>
                  <button onClick={onCloseRoutineModal} className="p-1 text-gray-400 hover:text-white">
                    <Icon name="x" />
                  </button>
                </div>
                <div className="flex-1 overflow-y-auto p-3 space-y-2">
                  {routines.length === 0 ? (
                    <div className="text-center py-10 text-xs text-gray-500">
                      저장된 루틴이 없습니다.<br/>운동 추가 화면에서 '루틴' 탭에 저장해보세요.
                    </div>
                  ) : (
                    routines.map(r => (
                      <div key={r.id} className="bg-[#282828] border border-gray-700/60 rounded-xl p-3">
                        <div className="flex justify-between items-start">
                          <div>
                            <div className="font-bold text-sm text-gray-100">{r.name}</div>
                            <div className="text-xs text-gray-400 mt-0.5">{r.partSummary} • {r.exercises.length}개 운동</div>
                            <div className="text-[10px] text-gray-500 mt-0.5">{r.createdAt} 생성</div>
                          </div>
                          <button
                            onClick={() => onApplyRoutine(r)}
                            className="text-xs bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-lg active:scale-95 transition-transform"
                          >
                            적용
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 날짜 롱탭 → 복사/이동/삭제 메뉴 */}
          {dateActionState && dateActionState.mode === 'menu' && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-[#1E1E1E] border border-gray-700 rounded-2xl w-full max-w-xs p-4 space-y-3 shadow-2xl">
                <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                  <h3 className="font-bold text-sm text-gray-100">{dateActionState.date}</h3>
                  <button onClick={() => setDateActionState(null)} className="p-1 text-gray-400 hover:text-white">
                    <Icon name="x" />
                  </button>
                </div>
                <button
                  onClick={() => {
                    setTargetPickDate({ year: currentYearMonth.year, month: currentYearMonth.month, day: 1 });
                    setDateActionState({ ...dateActionState, mode: 'pick-target', action: 'copy' });
                  }}
                  className="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-sm font-semibold text-gray-100 rounded-xl flex items-center justify-center space-x-2"
                >
                  <Icon name="copy" className="w-4 h-4" /> <span>다른 날짜로 복사</span>
                </button>
                <button
                  onClick={() => {
                    setTargetPickDate({ year: currentYearMonth.year, month: currentYearMonth.month, day: 1 });
                    setDateActionState({ ...dateActionState, mode: 'pick-target', action: 'move' });
                  }}
                  className="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-sm font-semibold text-gray-100 rounded-xl flex items-center justify-center space-x-2"
                >
                  <Icon name="move" className="w-4 h-4" /> <span>다른 날짜로 이동</span>
                </button>
                <button
                  onClick={() => {
                    if (confirm(`${dateActionState.date} 기록을 삭제할까요?`)) {
                      onDeleteDateLog(dateActionState.date);
                    }
                  }}
                  className="w-full py-2.5 bg-red-900/40 hover:bg-red-900/60 text-sm font-semibold text-red-300 rounded-xl flex items-center justify-center space-x-2"
                >
                  <Icon name="trash-2" className="w-4 h-4" /> <span>기록 삭제</span>
                </button>
              </div>
            </div>
          )}

          {/* 복사/이동 대상 날짜 선택 */}
          {dateActionState && dateActionState.mode === 'pick-target' && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-[#1E1E1E] border border-gray-700 rounded-2xl w-full max-w-xs p-4 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                  <h3 className="font-bold text-sm text-gray-100">
                    {dateActionState.action === 'copy' ? '복사할 날짜 선택' : '이동할 날짜 선택'}
                  </h3>
                  <button onClick={() => setDateActionState(null)} className="p-1 text-gray-400 hover:text-white">
                    <Icon name="x" />
                  </button>
                </div>
                <div className="grid grid-cols-3 gap-2 text-center">
                  <select
                    value={targetPickDate.year}
                    onChange={(e) => setTargetPickDate({ ...targetPickDate, year: Number(e.target.value) })}
                    className="w-full bg-[#121212] border border-gray-700 rounded-lg p-2 text-xs text-white focus:outline-none"
                  >
                    {[2024, 2025, 2026, 2027].map(y => <option key={y} value={y}>{y}년</option>)}
                  </select>
                  <select
                    value={targetPickDate.month}
                    onChange={(e) => setTargetPickDate({ ...targetPickDate, month: Number(e.target.value) })}
                    className="w-full bg-[#121212] border border-gray-700 rounded-lg p-2 text-xs text-white focus:outline-none"
                  >
                    {Array.from({ length: 12 }, (_, i) => i + 1).map(m => <option key={m} value={m}>{m}월</option>)}
                  </select>
                  <select
                    value={targetPickDate.day}
                    onChange={(e) => setTargetPickDate({ ...targetPickDate, day: Number(e.target.value) })}
                    className="w-full bg-[#121212] border border-gray-700 rounded-lg p-2 text-xs text-white focus:outline-none"
                  >
                    {Array.from({ length: new Date(targetPickDate.year, targetPickDate.month, 0).getDate() }, (_, i) => i + 1).map(d => (
                      <option key={d} value={d}>{d}일</option>
                    ))}
                  </select>
                </div>
                <button
                  onClick={() => {
                    const toDate = `${targetPickDate.year}-${String(targetPickDate.month).padStart(2, '0')}-${String(targetPickDate.day).padStart(2, '0')}`;
                    if (dateActionState.action === 'copy') onCopyDateLog(dateActionState.date, toDate);
                    else onMoveDateLog(dateActionState.date, toDate);
                  }}
                  className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl transition-colors"
                >
                  확인
                </button>
              </div>
            </div>
          )}

          {isMonthPickerOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-[#1E1E1E] border border-gray-700 rounded-2xl w-full max-w-xs p-4 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                  <h3 className="font-bold text-base text-gray-100">연 / 월 선택</h3>
                  <button onClick={() => setIsMonthPickerOpen(false)} className="p-1 text-gray-400 hover:text-white">
                    <Icon name="x" />
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-3 text-center">
                  <div>
                    <label className="text-xs text-gray-400 block mb-1">연도</label>
                    <select 
                      value={currentYearMonth.year}
                      onChange={(e) => setCurrentYearMonth({ ...currentYearMonth, year: Number(e.target.value) })}
                      className="w-full bg-[#121212] border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none"
                    >
                      {[2024, 2025, 2026, 2027].map(y => (
                        <option key={y} value={y}>{y}년</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-xs text-gray-400 block mb-1">월</label>
                    <select 
                      value={currentYearMonth.month}
                      onChange={(e) => setCurrentYearMonth({ ...currentYearMonth, month: Number(e.target.value) })}
                      className="w-full bg-[#121212] border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none"
                    >
                      {Array.from({ length: 12 }, (_, i) => i + 1).map(m => (
                        <option key={m} value={m}>{m}월</option>
                      ))}
                    </select>
                  </div>
                </div>

                <button 
                  onClick={() => setIsMonthPickerOpen(false)}
                  className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl transition-colors"
                >
                  확인 및 적용
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================================
    // 화면 2: Multi-Depth 운동 선택 시스템
    // ============================================================================
    function MultiDepthSelectView({ exerciseDb, onToggleFavorite, routines, onSaveRoutine, onDeleteRoutine, stagedExercises, setStagedExercises, onBack, onComplete }) {
      return (
        <ExercisePickerBody
          exerciseDb={exerciseDb}
          onToggleFavorite={onToggleFavorite}
          routines={routines}
          onSaveRoutine={onSaveRoutine}
          onDeleteRoutine={onDeleteRoutine}
          stagedExercises={stagedExercises}
          setStagedExercises={setStagedExercises}
          onBack={onBack}
          onComplete={onComplete}
          completeLabel="선택 완료"
        />
      );
    }

    // ============================================================================
    // 운동 중 '운동추가' 모달 (동일 운동 선택 UI를 오버레이로 재사용)
    // ============================================================================
    function AddExerciseModal({ exerciseDb, onToggleFavorite, routines, onSaveRoutine, onDeleteRoutine, existingIds, onClose, onComplete }) {
      const [localStaged, setLocalStaged] = useState([]);
      return (
        <div className="fixed inset-0 bg-[#121212] z-50 flex flex-col">
          <ExercisePickerBody
            exerciseDb={exerciseDb.filter(ex => !existingIds.includes(ex.id))}
            onToggleFavorite={onToggleFavorite}
            routines={routines}
            onSaveRoutine={onSaveRoutine}
            onDeleteRoutine={onDeleteRoutine}
            stagedExercises={localStaged}
            setStagedExercises={setLocalStaged}
            onBack={onClose}
            onComplete={() => onComplete(localStaged)}
            completeLabel="운동 추가"
          />
        </div>
      );
    }

    // ============================================================================
    // 운동 선택 화면 본체 (분류/전체/최근 30일/즐겨찾기/루틴/커스텀 탭 공통 컴포넌트)
    // ============================================================================
    function ExercisePickerBody({ exerciseDb, onToggleFavorite, routines, onSaveRoutine, onDeleteRoutine, stagedExercises, setStagedExercises, onBack, onComplete, completeLabel }) {
      const [activeTab, setActiveTab] = useState('분류');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedPart, setSelectedPart] = useState(null);

      const filteredExercises = useMemo(() => {
        return exerciseDb.filter(ex => {
          if (activeTab === '즐겨찾기' && !ex.isFavorite) return false;
          if (selectedPart && ex.partId !== selectedPart.id) return false;
          return isSearchMatch(ex.name, searchQuery) || isSearchMatch(ex.category, searchQuery);
        });
      }, [exerciseDb, activeTab, selectedPart, searchQuery]);

      const handleToggleStage = (exercise) => {
        const exists = stagedExercises.some(item => item.id === exercise.id);
        if (exists) {
          setStagedExercises(stagedExercises.filter(item => item.id !== exercise.id));
        } else {
          setStagedExercises([...stagedExercises, exercise]);
        }
      };

      const handleSaveCurrentAsRoutine = () => {
        if (stagedExercises.length === 0) return;
        const name = prompt('루틴 이름을 입력하세요 (예: 등, 이두)');
        if (name && name.trim()) onSaveRoutine(name.trim(), stagedExercises);
      };

      const handleLoadRoutine = (routine) => {
        const toAdd = routine.exercises.filter(rEx => !stagedExercises.some(s => s.id === rEx.id));
        const fullFromDb = toAdd.map(rEx => exerciseDb.find(e => e.id === rEx.id) || rEx);
        setStagedExercises([...stagedExercises, ...fullFromDb]);
      };

      return (
        <div className="flex flex-col h-full bg-[#121212] relative overflow-hidden">
          <div className="p-3 bg-[#1E1E1E] border-b border-gray-800 flex items-center space-x-3 flex-shrink-0">
            <button onClick={onBack} className="p-1 text-gray-400 hover:text-white">
              <Icon name="chevron-left" className="w-6 h-6" />
            </button>
            <div className="flex-1 relative">
              <input 
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search(스쿼트, ㅅㅋㅌ ...)"
                className="w-full bg-[#121212] border border-gray-700/80 rounded-lg pl-3 pr-8 py-2 text-sm text-gray-100 focus:outline-none focus:border-blue-500"
              />
              {searchQuery && (
                <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-2.5 text-gray-500 hover:text-white">
                  <Icon name="x" className="w-4 h-4" />
                </button>
              )}
            </div>
            <button className="p-1 text-blue-400"><Icon name="plus" className="w-6 h-6" /></button>
          </div>

          <div className="flex border-b border-gray-800 bg-[#1A1A1A] text-xs font-semibold overflow-x-auto flex-shrink-0">
            {['분류', '전체', '최근 30일', '즐겨찾기', '루틴', '커스텀'].map((tab) => (
              <button
                key={tab}
                onClick={() => {
                  setActiveTab(tab);
                  setSelectedPart(null);
                }}
                className={`px-4 py-3 whitespace-nowrap transition-colors ${
                  activeTab === tab ? 'text-blue-400 border-b-2 border-blue-500 bg-[#222834]' : 'text-gray-400 hover:text-gray-200'
                }`}
              >
                {tab}
              </button>
            ))}
          </div>

          <div className="flex-1 overflow-y-auto p-3">
            {activeTab === '루틴' && (
              <div className="space-y-2">
                {routines.length === 0 ? (
                  <div className="text-center py-12 text-gray-500 text-xs">
                    저장된 루틴이 없습니다.<br/>운동을 선택한 뒤 아래 '루틴으로 저장' 버튼을 눌러보세요.
                  </div>
                ) : (
                  routines.map(r => (
                    <div key={r.id} className="bg-[#1E1E1E] border border-gray-800/80 rounded-xl p-3 flex items-center justify-between">
                      <div>
                        <div className="font-bold text-sm text-gray-100">{r.name}</div>
                        <div className="text-xs text-gray-400">{r.partSummary} • {r.exercises.length}개 운동</div>
                      </div>
                      <div className="flex items-center space-x-2">
                        <button
                          onClick={() => handleLoadRoutine(r)}
                          className="text-xs bg-blue-600 hover:bg-blue-500 text-white font-bold px-2.5 py-1.5 rounded-lg"
                        >
                          불러오기
                        </button>
                        <button
                          onClick={() => { if (confirm(`'${r.name}' 루틴을 삭제할까요?`)) onDeleteRoutine(r.id); }}
                          className="p-1.5 text-gray-500 hover:text-red-400"
                        >
                          <Icon name="trash-2" className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {activeTab !== '루틴' && activeTab === '분류' && !selectedPart && !searchQuery && (
              <div className="space-y-4">
                <div className="flex justify-between items-center text-xs text-gray-400 font-semibold px-1">
                  <span>부위 선택</span>
                  <span className="text-blue-400">전체 {exerciseDb.length}개 운동</span>
                </div>
                
                <div className="grid grid-cols-2 gap-2.5">
                  {BODY_PARTS.map((part) => (
                    <div
                      key={part.id}
                      onClick={() => setSelectedPart(part)}
                      className="bg-[#1E1E1E] hover:bg-[#252525] border border-gray-800 rounded-xl p-3 flex items-center justify-between cursor-pointer transition-all active:scale-98"
                    >
                      <div className="flex items-center space-x-3">
                        <span className="text-2xl">{part.icon}</span>
                        <span className="font-semibold text-sm">{part.name}</span>
                      </div>
                      <span className="text-xs font-mono text-blue-400">
                        {exerciseDb.filter(e => e.partId === part.id).length}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab !== '루틴' && (selectedPart || activeTab !== '분류' || searchQuery) && (
              <div className="space-y-2">
                {selectedPart && (
                  <div className="flex items-center space-x-2 text-xs text-blue-400 mb-3 bg-[#1E1E1E] p-2 rounded-lg">
                    <button onClick={() => setSelectedPart(null)} className="hover:underline flex items-center">
                      <Icon name="chevron-left" className="w-4 h-4 mr-1" /> 부위 목록으로
                    </button>
                    <span>/</span>
                    <span className="font-bold text-gray-200">{selectedPart.name}</span>
                  </div>
                )}

                {filteredExercises.length === 0 ? (
                  <div className="text-center py-12 text-gray-500 text-xs">
                    등록된 운동 목록이 없습니다.
                  </div>
                ) : (
                  filteredExercises.map((ex) => {
                    const isStaged = stagedExercises.some(item => item.id === ex.id);
                    return (
                      <div
                        key={ex.id}
                        onClick={() => handleToggleStage(ex)}
                        className={`p-3.5 rounded-xl border flex items-center justify-between cursor-pointer transition-all ${
                          isStaged 
                            ? 'bg-[#1E293B] border-blue-500/80 shadow-md' 
                            : 'bg-[#1E1E1E] border-gray-800/80 hover:bg-[#242424]'
                        }`}
                      >
                        <div className="flex items-center space-x-3">
                          <div className="w-10 h-10 rounded-lg bg-[#282828] flex items-center justify-center text-xl">
                            🏋️
                          </div>
                          <div>
                            <div className="font-bold text-sm text-gray-100">{ex.name}</div>
                            <div className="text-xs text-gray-400">{ex.category} • {ex.equipment}</div>
                          </div>
                        </div>

                        <div className="flex items-center space-x-2">
                          <button
                            onClick={(e) => { e.stopPropagation(); onToggleFavorite(ex.id); }}
                            className="p-1"
                            title="즐겨찾기"
                          >
                            <Icon name="star" className={`w-4 h-4 ${ex.isFavorite ? 'text-yellow-400' : 'text-gray-600'}`} {...(ex.isFavorite ? { fill: 'currentColor' } : {})} />
                          </button>
                          <span className={`text-xs px-2.5 py-1 rounded-lg ${isStaged ? 'bg-blue-600 text-white font-bold' : 'bg-gray-800 text-gray-400'}`}>
                            {isStaged ? '선택됨' : '추가'}
                          </span>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            )}
          </div>

          <div className="bg-[#1E1E1E] border-t border-gray-800 p-3 bottom-bar-safe space-y-3 flex-shrink-0">
            <div className="flex items-center justify-between text-xs px-1">
              <div className="flex items-center space-x-1.5 text-gray-300 font-bold">
                <Icon name="layers" className="w-4 h-4 text-blue-400" />
                <span>선택된 운동 ({stagedExercises.length})</span>
              </div>
              {stagedExercises.length > 0 && (
                <button onClick={handleSaveCurrentAsRoutine} className="text-[11px] text-blue-400 font-semibold hover:underline flex items-center space-x-1">
                  <Icon name="bookmark-plus" className="w-3.5 h-3.5" />
                  <span>루틴으로 저장</span>
                </button>
              )}
            </div>

            <div className="flex space-x-2 overflow-x-auto pb-1">
              {stagedExercises.map((ex, index) => (
                <div 
                  key={ex.id}
                  className="min-w-[120px] bg-[#282828] border border-gray-700/60 rounded-lg p-2 relative flex flex-col justify-between"
                >
                  <button 
                    onClick={() => setStagedExercises(stagedExercises.filter(item => item.id !== ex.id))}
                    className="absolute top-1 right-1 p-1 text-gray-400 hover:text-white"
                  >
                    <Icon name="x" className="w-3.5 h-3.5" />
                  </button>
                  <span className="text-[10px] font-mono text-blue-400 font-bold">0{index + 1}</span>
                  <div className="text-xs font-semibold truncate my-1 text-gray-200">{ex.name}</div>
                  <div className="text-[9px] text-gray-400">{ex.equipment}</div>
                </div>
              ))}

              {stagedExercises.length === 0 && (
                <div className="w-full text-center py-2 text-xs text-gray-500 border border-dashed border-gray-700 rounded-lg">
                  운동을 선택하여 추가해 주세요
                </div>
              )}
            </div>

            <button
              onClick={onComplete}
              disabled={stagedExercises.length === 0}
              className="w-full py-3 bg-blue-600 hover:bg-blue-500 disabled:bg-gray-800 text-white text-sm font-bold rounded-xl transition-colors shadow-lg active:scale-98"
            >
              {completeLabel} ({stagedExercises.length}개 운동)
            </button>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 화면 3: 운동 디테일 기록 (무게/횟수 증감 + 원버튼 세트 삭제)
    // ============================================================================
    function WorkoutDetailView({
      activeSession,
      currentExIndex,
      setCurrentExIndex,
      onBack,
      handleToggleSetComplete,
      handleUpdateSetField,
      handleSetFieldDirect,
      handleDeleteSet,
      handleAddSet,
      onOpenReplace,
      onOpenAddExercise,
      onOpenExerciseInfo,
      onSaveRoutine,
      timerActive,
      timerTotal,
      timerRemaining,
      isMuted,
      setIsMuted,
      startTimer,
      stopTimer,
      addTimerSeconds
    }) {
      const currentEx = activeSession.exercises[currentExIndex];
      const touchStartXRef = useRef(null);
      const [editingField, setEditingField] = useState(null); // { setIdx, field }
      const [editingValue, setEditingValue] = useState('');

      // 오늘 운동 조합 전체를 하나의 루틴으로 저장 (하루 운동 세트 구성)
      const onSaveCurrentAsRoutine = () => {
        if (!activeSession.exercises || activeSession.exercises.length === 0) return;
        const name = prompt('루틴 이름을 입력하세요 (예: 등, 이두)');
        if (name && name.trim()) onSaveRoutine(name.trim(), activeSession.exercises);
      };

      const handleTouchStart = (e) => {
        touchStartXRef.current = e.touches[0].clientX;
      };

      const handleTouchEnd = (e) => {
        if (touchStartXRef.current === null) return;
        const diffX = touchStartXRef.current - e.changedTouches[0].clientX;

        if (Math.abs(diffX) > 50) {
          if (diffX > 0 && currentExIndex < activeSession.exercises.length - 1) {
            setCurrentExIndex(prev => prev + 1);
          } else if (diffX < 0 && currentExIndex > 0) {
            setCurrentExIndex(prev => prev - 1);
          }
        }
        touchStartXRef.current = null;
      };

      const totalVolume = useMemo(() => {
        if (!currentEx) return 0;
        return currentEx.sets.reduce((sum, s) => sum + (s.completed ? s.weight * s.reps : 0), 0);
      }, [currentEx]);

      const timerProgress = useMemo(() => {
        if (!timerActive || timerTotal <= 0) return 0;
        return ((timerTotal - timerRemaining) / timerTotal) * 100;
      }, [timerActive, timerTotal, timerRemaining]);

      const formatTime = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      if (!currentEx) return null;

      return (
        <div className="flex flex-col h-full bg-[#121212] relative overflow-hidden">
          {/* 상단 헤더 */}
          <div className="p-3 bg-[#1E1E1E] border-b border-gray-800 flex items-center justify-between flex-shrink-0">
            <button onClick={onBack} className="p-1 text-gray-400 hover:text-white">
              <Icon name="chevron-left" className="w-6 h-6" />
            </button>
            <span className="text-sm font-bold text-gray-200">{activeSession.date} 운동 기록</span>
            <div className="flex items-center space-x-3">
              <button onClick={onSaveCurrentAsRoutine} className="text-xs font-bold text-gray-200 bg-[#282828] px-2 py-1 rounded-md hover:bg-[#333333]">
                루틴저장
              </button>
              <button onClick={onBack} className="p-1 text-blue-400 font-bold text-sm">완료</button>
            </div>
          </div>

          {/* 인디케이터 */}
          <div className="flex justify-center items-center space-x-2 py-2 bg-[#1A1A1A] border-b border-gray-800 flex-shrink-0">
            {activeSession.exercises.map((ex, idx) => {
              const allCompleted = ex.sets.every(s => s.completed);
              return (
                <button
                  key={idx}
                  onClick={() => setCurrentExIndex(idx)}
                  className={`w-3 h-3 rounded-full transition-all flex items-center justify-center ${
                    currentExIndex === idx 
                      ? 'bg-blue-500 ring-2 ring-blue-300 w-4 h-4' 
                      : allCompleted ? 'bg-green-500' : 'bg-gray-700'
                  }`}
                />
              );
            })}
          </div>

          {/* 메인 세트 영역 */}
          <div 
            onTouchStart={handleTouchStart}
            onTouchEnd={handleTouchEnd}
            className="flex-1 overflow-y-auto p-4 space-y-4 pb-36"
          >
            <div className="flex justify-between items-center text-[11px] text-gray-500 border-b border-gray-800/60 pb-1">
              <span>👈 좌우 스와이프로 운동 전환</span>
              <span>{currentExIndex + 1} / {activeSession.exercises.length}</span>
            </div>

            <div>
              <div className="flex justify-between items-start">
                <div className="flex items-center space-x-1.5">
                  <h2 className="text-xl font-extrabold text-white">{currentEx.name}</h2>
                  <button onClick={() => onOpenExerciseInfo(currentEx)} className="text-gray-400 hover:text-blue-400">
                    <Icon name="info" className="w-4 h-4" />
                  </button>
                </div>
                <div className="flex items-center space-x-3 flex-shrink-0">
                  <button onClick={onOpenAddExercise} className="text-xs text-blue-400 font-bold hover:underline">운동추가</button>
                  <button onClick={onOpenReplace} className="text-xs text-blue-400 font-bold hover:underline">교체</button>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2 mt-3 bg-[#1E1E1E] p-3 rounded-xl border border-gray-800">
                <div>
                  <div className="text-[10px] text-gray-400">최대 무게</div>
                  <div className="text-sm font-bold text-gray-100">{currentEx.prWeight} x {currentEx.prReps}</div>
                </div>
                <div>
                  <div className="text-[10px] text-gray-400">추정 1RM</div>
                  <div className="text-sm font-bold text-blue-400">{currentEx.pr1RM} kg</div>
                </div>
                <div>
                  <div className="text-[10px] text-gray-400">총 볼륨</div>
                  <div className="text-sm font-bold text-gray-100">{totalVolume} kg</div>
                </div>
              </div>
            </div>

            {/* 세트 리스트 (+5 / -5, +1 / -1, 세트 원버튼 삭제) */}
            <div className="space-y-2">
              {currentEx.sets.map((set, setIdx) => (
                <div 
                  key={set.setNum}
                  className={`p-2.5 rounded-xl border flex items-center justify-between transition-all ${
                    set.completed ? 'bg-[#18261E] border-green-800/60' : 'bg-[#1E1E1E] border-gray-800'
                  }`}
                >
                  <div className="flex items-center space-x-2">
                    <button 
                      onClick={() => handleToggleSetComplete(currentExIndex, setIdx)}
                      className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs transition-colors ${
                        set.completed ? 'bg-green-500 text-black' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'
                      }`}
                    >
                      {set.completed ? '✓' : set.setNum}
                    </button>
                    <div className="text-[10px] text-gray-400">
                      휴식<br/><span className="font-mono text-gray-200">{formatTime(set.restSeconds)}</span>
                    </div>
                  </div>

                  {/* 수치 표시 영역 (터치하여 직접 입력 가능) */}
                  <div className="flex items-center space-x-2">
                    <div className="text-center min-w-[42px]">
                      {editingField && editingField.setIdx === setIdx && editingField.field === 'weight' ? (
                        <input
                          type="number"
                          autoFocus
                          value={editingValue}
                          onChange={(e) => setEditingValue(e.target.value)}
                          onBlur={() => { handleSetFieldDirect(currentExIndex, setIdx, 'weight', editingValue); setEditingField(null); }}
                          onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
                          className="w-12 bg-[#121212] border border-blue-500 rounded text-center text-sm font-bold text-white font-mono py-0.5"
                        />
                      ) : (
                        <span
                          onClick={() => { setEditingField({ setIdx, field: 'weight' }); setEditingValue(String(set.weight)); }}
                          className="text-sm font-bold text-white font-mono cursor-pointer border-b border-dashed border-gray-600"
                        >
                          {set.weight}
                        </span>
                      )}
                      <span className="text-[10px] text-gray-400 ml-0.5">kg</span>
                    </div>
                    <div className="text-center min-w-[32px]">
                      {editingField && editingField.setIdx === setIdx && editingField.field === 'reps' ? (
                        <input
                          type="number"
                          autoFocus
                          value={editingValue}
                          onChange={(e) => setEditingValue(e.target.value)}
                          onBlur={() => { handleSetFieldDirect(currentExIndex, setIdx, 'reps', editingValue); setEditingField(null); }}
                          onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
                          className="w-10 bg-[#121212] border border-blue-500 rounded text-center text-sm font-bold text-white font-mono py-0.5"
                        />
                      ) : (
                        <span
                          onClick={() => { setEditingField({ setIdx, field: 'reps' }); setEditingValue(String(set.reps)); }}
                          className="text-sm font-bold text-white font-mono cursor-pointer border-b border-dashed border-gray-600"
                        >
                          {set.reps}
                        </span>
                      )}
                      <span className="text-[10px] text-gray-400 ml-0.5">회</span>
                    </div>
                  </div>

                  {/* 미세 조절 버튼군 (-5, +5, -1, +1, 삭제) */}
                  <div className="flex items-center space-x-1">
                    {/* 무게 -5 / +5 */}
                    <div className="flex flex-col space-y-0.5">
                      <button 
                        onClick={() => handleUpdateSetField(currentExIndex, setIdx, 'weight', 5)}
                        className="px-1.5 py-0.5 bg-gray-800 text-[9px] text-blue-400 font-bold rounded hover:bg-gray-700 active:scale-95"
                      >
                        +5
                      </button>
                      <button 
                        onClick={() => handleUpdateSetField(currentExIndex, setIdx, 'weight', -5)}
                        className="px-1.5 py-0.5 bg-gray-800 text-[9px] text-red-400 font-bold rounded hover:bg-gray-700 active:scale-95"
                      >
                        -5
                      </button>
                    </div>

                    {/* 횟수 -1 / +1 */}
                    <div className="flex flex-col space-y-0.5">
                      <button 
                        onClick={() => handleUpdateSetField(currentExIndex, setIdx, 'reps', 1)}
                        className="px-1.5 py-0.5 bg-gray-800 text-[9px] text-blue-400 font-bold rounded hover:bg-gray-700 active:scale-95"
                      >
                        +1
                      </button>
                      <button 
                        onClick={() => handleUpdateSetField(currentExIndex, setIdx, 'reps', -1)}
                        className="px-1.5 py-0.5 bg-gray-800 text-[9px] text-red-400 font-bold rounded hover:bg-gray-700 active:scale-95"
                      >
                        -1
                      </button>
                    </div>

                    {/* 원버튼 삭제 (휴지통) */}
                    <button 
                      onClick={() => handleDeleteSet(currentExIndex, setIdx)}
                      className="p-1.5 text-gray-500 hover:text-red-400 active:scale-90 transition-transform ml-1"
                      title="세트 삭제"
                    >
                      <Icon name="trash-2" className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              ))}
            </div>

            <button
              onClick={() => handleAddSet(currentExIndex)}
              className="w-full py-2.5 border border-dashed border-gray-700 hover:border-blue-500 text-gray-400 hover:text-blue-400 rounded-xl text-xs font-bold flex items-center justify-center space-x-1 transition-colors"
            >
              <Icon name="plus" className="w-4 h-4" />
              <span>세트 추가</span>
            </button>
          </div>

          {/* 하단 타이머 바 ('정지' 명칭 변경 & 높이 고정) */}
          <div className="absolute bottom-0 left-0 right-0 bg-[#1E1E1E] border-t border-gray-800 p-3 bottom-bar-safe shadow-2xl z-20">
            <div className="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden mb-2">
              <div 
                className="bg-blue-500 h-full transition-all duration-300 ease-linear"
                style={{ width: `${timerProgress}%` }}
              />
            </div>

            <div className="flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <Icon name="clock" className={`w-5 h-5 ${timerActive ? 'text-blue-400 animate-pulse' : 'text-gray-500'}`} />
                <div>
                  <div className="text-[10px] text-gray-400">휴식 타이머</div>
                  <div className="text-lg font-bold font-mono text-white leading-none">
                    {formatTime(timerRemaining)} <span className="text-xs text-gray-500">/ {formatTime(timerTotal)}</span>
                  </div>
                </div>
              </div>

              <div className="flex items-center space-x-1.5">
                <button 
                  onClick={() => setIsMuted(!isMuted)}
                  className="p-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-gray-300"
                >
                  <Icon name={isMuted ? "volume-x" : "volume-2"} className={`w-4 h-4 ${isMuted ? 'text-red-400' : 'text-blue-400'}`} />
                </button>

                <button 
                  onClick={() => addTimerSeconds(-30)}
                  className="px-2.5 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-bold text-red-400 rounded-lg active:scale-95 transition-transform"
                >
                  -30s
                </button>

                <button 
                  onClick={() => addTimerSeconds(30)}
                  className="px-2.5 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-bold text-blue-400 rounded-lg active:scale-95 transition-transform"
                >
                  +30s
                </button>

                {/* '정지' 명칭으로 고정 및 크기 유지 */}
                <button 
                  onClick={() => {
                    if (timerActive) stopTimer();
                    else startTimer(60);
                  }}
                  className="w-16 h-9 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-lg flex items-center justify-center space-x-1 shadow-md active:scale-95 transition-transform"
                >
                  <Icon name={timerActive ? "pause" : "play"} className="w-3.5 h-3.5" />
                  <span>{timerActive ? '정지' : '시작'}</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 운동 교체 팝업 모달 컴포넌트
    // ============================================================================
    function ReplaceExerciseModal({ exerciseDb, currentExercise, onClose, onSelectReplace }) {
      // 동일 부위의 다른 운동 필터링
      const samePartExercises = useMemo(() => {
        return exerciseDb.filter(ex => ex.partId === currentExercise.partId && ex.id !== currentExercise.id);
      }, [exerciseDb, currentExercise]);

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-[#1E1E1E] border border-gray-700 rounded-2xl w-full max-w-sm max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
            <div className="p-4 border-b border-gray-800 flex justify-between items-center bg-[#252525]">
              <div>
                <h3 className="font-bold text-base text-gray-100">운동 교체</h3>
                <p className="text-xs text-blue-400">{currentExercise.name} ➡️ 대체할 운동 선택</p>
              </div>
              <button onClick={onClose} className="p-1 text-gray-400 hover:text-white">
                <Icon name="x" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-3 space-y-2">
              {samePartExercises.length === 0 ? (
                <div className="text-center py-8 text-xs text-gray-500">
                  동일 부위 대체 가능 운동이 없습니다.
                </div>
              ) : (
                samePartExercises.map((ex) => (
                  <div
                    key={ex.id}
                    onClick={() => onSelectReplace(ex)}
                    className="bg-[#282828] hover:bg-[#323232] border border-gray-700/60 rounded-xl p-3 flex items-center justify-between cursor-pointer transition-all active:scale-98"
                  >
                    <div>
                      <div className="font-bold text-sm text-gray-200">{ex.name}</div>
                      <div className="text-xs text-gray-400">{ex.category} • {ex.equipment}</div>
                    </div>
                    <span className="text-xs bg-blue-600 text-white font-bold px-2.5 py-1 rounded-lg">
                      교체
                    </span>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 운동별 정보 / 히스토리 / 차트 모달 (유튜브 영상 링크 포함)
    // ============================================================================
    function ExerciseInfoModal({ exercise, workoutLogs, onClose }) {
      const [tab, setTab] = useState('정보');

      // 전체 운동 기록에서 동일 운동(id) 이력 수집 (최신순)
      const history = useMemo(() => {
        const rows = [];
        Object.keys(workoutLogs).sort((a, b) => b.localeCompare(a)).forEach(date => {
          const log = workoutLogs[date];
          if (!log.exercises) return;
          const match = log.exercises.find(e => e.id === exercise.id);
          if (match) rows.push({ date, exercise: match });
        });
        return rows;
      }, [workoutLogs, exercise.id]);

      const stats = useMemo(() => {
        let totalSets = 0;
        let bestVolume = 0;
        let best1RM = 0;
        history.forEach(row => {
          const sets = row.exercise.sets || [];
          totalSets += sets.filter(s => s.completed).length;
          const vol = sets.reduce((sum, s) => sum + (s.completed ? s.weight * s.reps : 0), 0);
          if (vol > bestVolume) bestVolume = vol;
          if (row.exercise.pr1RM > best1RM) best1RM = row.exercise.pr1RM;
        });
        return { sessions: history.length, totalSets, bestVolume, best1RM };
      }, [history]);

      const youtubeSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(exercise.name + ' 운동 방법')}`;

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-[#1E1E1E] border border-gray-700 rounded-2xl w-full max-w-sm max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div className="p-4 border-b border-gray-800 flex justify-between items-center bg-[#252525]">
              <h3 className="font-bold text-base text-gray-100">{exercise.name}</h3>
              <button onClick={onClose} className="p-1 text-gray-400 hover:text-white">
                <Icon name="x" />
              </button>
            </div>

            <div className="flex border-b border-gray-800 bg-[#1A1A1A] text-xs font-semibold flex-shrink-0">
              {['정보', '히스토리', '차트'].map(t => (
                <button
                  key={t}
                  onClick={() => setTab(t)}
                  className={`flex-1 py-2.5 transition-colors ${
                    tab === t ? 'text-blue-400 border-b-2 border-blue-500 bg-[#222834]' : 'text-gray-400 hover:text-gray-200'
                  }`}
                >
                  {t === '정보' ? '운동 정보' : t}
                </button>
              ))}
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {tab === '정보' && (
                <div className="space-y-4">
                  <div className="grid grid-cols-3 gap-2 text-center">
                    <div className="bg-[#282828] rounded-lg p-2">
                      <div className="text-[10px] text-gray-400">수행 횟수</div>
                      <div className="text-sm font-bold text-white">{stats.sessions}일</div>
                    </div>
                    <div className="bg-[#282828] rounded-lg p-2">
                      <div className="text-[10px] text-gray-400">총 세트</div>
                      <div className="text-sm font-bold text-white">{stats.totalSets}세트</div>
                    </div>
                    <div className="bg-[#282828] rounded-lg p-2">
                      <div className="text-[10px] text-gray-400">최고 1RM</div>
                      <div className="text-sm font-bold text-blue-400">{stats.best1RM || '-'} kg</div>
                    </div>
                  </div>

                  <a
                    href={youtubeSearchUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full py-2.5 bg-red-600/90 hover:bg-red-600 text-white text-sm font-bold rounded-xl flex items-center justify-center space-x-2"
                  >
                    <Icon name="youtube" className="w-4 h-4" />
                    <span>동영상으로 자세 확인하기</span>
                  </a>

                  <p className="text-xs text-gray-500 leading-relaxed">
                    유튜브에서 '{exercise.name}' 검색 결과로 연결됩니다. 정확한 자세와 호흡법을 영상으로 확인해보세요.
                  </p>
                </div>
              )}

              {tab === '히스토리' && (
                <div className="space-y-2">
                  {history.length === 0 ? (
                    <div className="text-center py-10 text-xs text-gray-500">아직 기록된 이력이 없습니다.</div>
                  ) : (
                    history.map((row, idx) => (
                      <div key={idx} className="bg-[#282828] rounded-lg p-2.5">
                        <div className="text-xs font-bold text-blue-400 mb-1">{row.date}</div>
                        <div className="grid grid-cols-4 gap-1 text-[10px] text-gray-300">
                          {row.exercise.sets.map(s => (
                            <div key={s.setNum} className="bg-[#1E1E1E] rounded p-1 text-center">
                              <div className="text-gray-500">{s.setNum}세트</div>
                              <div className="font-mono">{s.weight}kg</div>
                              <div className="font-mono">{s.reps}회</div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {tab === '차트' && (
                <div className="space-y-3">
                  {history.length === 0 ? (
                    <div className="text-center py-10 text-xs text-gray-500">차트를 표시할 데이터가 없습니다.</div>
                  ) : (
                    <>
                      <div className="text-xs text-gray-400 mb-1">세션별 볼륨 추이 (최근 → 과거)</div>
                      <div className="flex items-end space-x-1.5 h-32 bg-[#181818] rounded-lg p-2">
                        {history.slice(0, 10).reverse().map((row, idx) => {
                          const vol = row.exercise.sets.reduce((sum, s) => sum + (s.completed ? s.weight * s.reps : 0), 0);
                          const maxVol = Math.max(...history.slice(0, 10).map(r => r.exercise.sets.reduce((s2, s) => s2 + (s.completed ? s.weight * s.reps : 0), 0)), 1);
                          const heightPct = Math.max(4, (vol / maxVol) * 100);
                          return (
                            <div key={idx} className="flex-1 flex flex-col items-center justify-end h-full">
                              <div className="text-[8px] text-gray-400 mb-0.5">{vol}</div>
                              <div className="w-full bg-blue-500 rounded-t" style={{ height: `${heightPct}%` }}></div>
                            </div>
                          );
                        })}
                      </div>
                      <div className="space-y-1">
                        {history.slice(0, 8).map((row, idx) => {
                          const vol = row.exercise.sets.reduce((sum, s) => sum + (s.completed ? s.weight * s.reps : 0), 0);
                          return (
                            <div key={idx} className="flex justify-between text-[11px] text-gray-400 border-b border-gray-800/60 pb-1">
                              <span>{row.date}</span>
                              <span className="text-gray-200 font-mono">{vol} kg</span>
                            </div>
                          );
                        })}
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
