    const getChosung = (str) => {
      let result = '';
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i) - 0xac00;
        if (code >= 0 && code <= 11172) {
          result += CHOSUNG_LIST[Math.floor(code / 588)];
        } else {
          result += str[i];
        }
      }
      return result;
    };

    // 복싱 라운드 종료 벨과 유사한 종소리 (금속성 배음 + 잔향)
    const playBoxingBellSound = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        const ringBell = (startDelay) => {
          const startTime = ctx.currentTime + startDelay;
          // 벨 특유의 금속성 배음을 위해 여러 오실레이터를 겹침
          const partials = [
            { freq: 880, gain: 0.35, decay: 1.1 },
            { freq: 1320, gain: 0.22, decay: 0.9 },
            { freq: 1760, gain: 0.14, decay: 0.7 },
            { freq: 2640, gain: 0.08, decay: 0.5 },
          ];
          partials.forEach(p => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(p.freq, startTime);
            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.linearRampToValueAtTime(p.gain, startTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + p.decay);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + p.decay + 0.05);
          });
        };

        // 복싱 라운드 종료처럼 두 번 연속 타종
        ringBell(0);
        ringBell(0.22);
      } catch (e) {
        console.error('Audio play failed', e);
      }
    };
